<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aircraft Maintenance Log</title>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. Authentication Login Screen Container -->
  <div id="authContainer" class="card">
    <h2>🔐 Mechanic Sign In</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="mechanic@aero.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary">Sign In to Hangar App</button>
    </form>
  </div>

  <!-- 2. Main Application Container (Hidden until authenticated) -->
  <div id="appContainer" style="display: none;">
    <div class="card">
      <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1rem;">
        <h2 style="margin: 0;">✈️ Aircraft Maintenance Log</h2>
        <div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px;">
          <span id="welcomeUser" style="font-weight: 600; color: #334155;"></span>
          <button id="logoutBtn" class="btn btn-logout" style="float: none;">Sign Out</button>
        </div>
      </div>
      <div id="status" class="status online">Online Mode</div>
      <div id="loggedInMechanicDisplay" class="muted-note">Mechanic: <strong id="loggedInMechanicName">Loading...</strong></div>

      <form id="taskForm">
        <div class="form-group">
          <!-- Tail Number -->
          <input type="text" id="tailNumber" placeholder="Aircraft Tail # (e.g. RP-C1234)" required>
          
          <!-- Category -->
          <select id="category" required>
            <option value="">Select Maintenance Category...</option>
            <option value="Avionics & Radar">Avionics & Radar System</option>
            <option value="Turbine Engine Inspection">Turbine Engine & Propulsion</option>
            <option value="Hydraulic & Landing Gear">Hydraulics & Landing Gear</option>
            <option value="Airframe & Control Surfaces">Airframe & Control Surfaces</option>
          </select>
          
          <!-- Details -->
          <input type="text" id="taskInput" placeholder="Inspection Details / Findings..." required>

          <!-- Hidden: mechanic is automatically taken from the signed-in Supabase user -->
          <select id="mechanicSelect" style="display: none;">
            <option value="">Select Assigned Inspector/Mechanic...</option>
            <option value="Engr. Juan Dela Cruz (Avionics Tech)">Engr. Juan Dela Cruz (Avionics Tech)</option>
            <option value="Engr. Maria Santos (Powerplant Lead)">Engr. Maria Santos (Powerplant Lead)</option>
            <option value="Tech. Mark Reyes (Airframe Specialist)">Tech. Mark Reyes (Airframe Specialist)</option>
            <option value="Tech. Alex Garcia (Hydraulics Mechanic)">Tech. Alex Garcia (Hydraulics Mechanic)</option>
            <option value="custom">➕ Add New / Custom Name...</option>
          </select>

          <!-- Hidden input field if "Add New" is selected -->
          <input type="text" id="customMechanic" placeholder="Type Inspector/Mechanic Name..." style="display:none;">
        </div>

        <button type="submit" class="btn btn-primary">Log Maintenance Check</button>
      </form>
    </div>

    <button id="syncBtn" class="btn btn-sync">Sync Offline Logs to Cloud Database</button>

    <h3>Logged Inspections</h3>
    <div class="log-panel">
      <ul id="taskList" class="log-list"></ul>
    </div>
    <div id="emptyState" class="empty-state" style="display: none;">
      No inspection logs found. Perform a maintenance check to display logs here.
    </div>
  </div>

  <div id="logDetailModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="logDetailTitle">
      <div class="modal-header">
        <h3 id="logDetailTitle">Maintenance Details</h3>
        <button id="closeModalBtn" class="modal-close" aria-label="Close">×</button>
      </div>
      <div class="modal-meta">
        <div><strong>Aircraft:</strong> <span id="modalAircraft"></span></div>
        <div><strong>Category:</strong> <span id="modalCategory"></span></div>
        <div><strong>Mechanic:</strong> <span id="modalMechanic"></span></div>
        <div><strong>Status:</strong> <span id="modalStatus"></span></div>
        <div style="grid-column: 1 / -1;"><strong>Timestamp:</strong> <span id="modalTimestamp"></span></div>
      </div>
      <p id="modalDetails" class="modal-detail"></p>
    </div>
  </div>

  <!-- Link your external app.js file here -->
  <script src="app.js"></script>
</body>
</html>
